# Cucumber settings. Kept here (not in TestRunner annotations) so that
# -Dcucumber.filter.tags="@smoke" on the command line overrides the default below.
cucumber.glue=com.orangehrm.bdd
cucumber.filter.tags=not @wip
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, junit:target/cucumber-reports/cucumber.xml
cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=long
